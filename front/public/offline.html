<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d294a" />
    <title>Sin conexión | Liga Supersaludable</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        color: #213047;
        background: #fffaf6;
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
      }
      main {
        width: min(100%, 440px);
        padding: 40px 28px;
        border-radius: 28px;
        background: white;
        box-shadow: 0 18px 48px rgba(29, 41, 74, 0.12);
      }
      img { width: 112px; height: 112px; object-fit: contain; margin: 0 auto 24px; }
      h1 { margin: 0 0 12px; color: #1d294a; font-size: 1.8rem; }
      p { margin: 0 0 24px; line-height: 1.6; }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 999px;
        color: white;
        background: #1d294a;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>¡Volvemos en un momento!</h1>
      <p>No hay conexión a internet. Cuando vuelvas a estar en línea, podrás seguir explorando cuentos, juegos y retos saludables.</p>
      <a href="/">Intentar de nuevo</a>
    </main>
  </body>
</html>
